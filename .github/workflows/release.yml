name: Release

on:
  push:
    tags:
      - '3.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and extract release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Wodby 1 release tags must use 3.X.Y format'
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != 'tag' ]]; then
            echo '::error::Release tags must be annotated'
            exit 1
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" \
            --format='%(contents:subject)%0a%0a%(contents:body)' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo '::error::Release tags must contain release notes'
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --latest=false
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --latest=false
          fi
